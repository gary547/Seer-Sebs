<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seer® — No Brainer</title>
    <meta name="description" content="Seer® - commercial growth at your fingertips by No Brainer">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Montserrat:ital,wght@0,400..900;1,400..900&family=Open+Sans:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

    <script>
      // No-flash theme bootstrap — applies persisted theme before React mounts.
      (function () {
        try {
          var stored = localStorage.getItem("seer-theme");
          var theme = stored === "light" || stored === "dark" ? stored : "dark";
          if (theme === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <meta property="og:title" content="Seer® — No Brainer">
  <meta name="twitter:title" content="Seer® — No Brainer">
