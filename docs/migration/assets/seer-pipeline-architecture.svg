<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1040" viewBox="0 0 1680 1040" role="img" aria-labelledby="title desc">
  <title id="title">SEER durable calculation pipeline</title>
  <desc id="desc">Seven-phase, nineteen-stage Google Cloud workflow from keyword intake to calibration and controlled promotion.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#111318" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style>
      .display { font-family: "Avenir Next", "Segoe UI", sans-serif; font-weight: 700; fill: #111318; }
      .body { font-family: "Avenir Next", "Segoe UI", sans-serif; font-weight: 500; fill: #242934; }
      .muted { font-family: "Avenir Next", "Segoe UI", sans-serif; font-weight: 500; fill: #667080; }
      .eyebrow { font-family: "Avenir Next", "Segoe UI", sans-serif; font-weight: 700; letter-spacing: 2.2px; fill: #2563EB; }
      .phase { font-family: "Avenir Next", "Segoe UI", sans-serif; font-weight: 700; letter-spacing: 1.1px; fill: #111318; }
      .badge { font-family: "Avenir Next", "Segoe UI", sans-serif; font-weight: 700; letter-spacing: 0.4px; fill: #31568D; }
      .count { font-family: "Avenir Next", "Segoe UI", sans-serif; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1680" height="1040" fill="#F5F6F8"/>
  <path d="M0 0H1680V10H0Z" fill="#2563EB"/>

  <text x="44" y="58" class="eyebrow" font-size="15">SEER / TARGET ARCHITECTURE</text>
  <text x="44" y="106" class="display" font-size="38">Durable calculation pipeline</text>
  <text x="44" y="139" class="muted" font-size="18">One server-owned sequence · resumable work · explicit completion · controlled v2 promotion</text>

  <g filter="url(#shadow)">
    <rect x="44" y="178" width="196" height="690" rx="12" fill="#FFFFFF" stroke="#DDE1E6"/>
    <rect x="272" y="178" width="196" height="690" rx="12" fill="#FFFFFF" stroke="#DDE1E6"/>
    <rect x="500" y="178" width="196" height="690" rx="12" fill="#FFFFFF" stroke="#DDE1E6"/>
    <rect x="728" y="178" width="196" height="690" rx="12" fill="#FFFFFF" stroke="#DDE1E6"/>
    <rect x="956" y="178" width="196" height="690" rx="12" fill="#FFFFFF" stroke="#DDE1E6"/>
    <rect x="1184" y="178" width="196" height="690" rx="12" fill="#FFFFFF" stroke="#DDE1E6"/>
    <rect x="1412" y="178" width="224" height="690" rx="12" fill="#FFFFFF" stroke="#DDE1E6"/>
  </g>

  <g>
    <line x1="240" y1="230" x2="263" y2="230" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="468" y1="230" x2="491" y2="230" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="696" y1="230" x2="719" y2="230" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="924" y1="230" x2="947" y2="230" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="1152" y1="230" x2="1175" y2="230" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="1380" y1="230" x2="1403" y2="230" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g>
    <circle cx="72" cy="228" r="18" fill="#2563EB"/>
    <text x="72" y="234" text-anchor="middle" class="count" font-size="16">1</text>
    <text x="100" y="234" class="phase" font-size="16">INTAKE</text>

    <circle cx="300" cy="228" r="18" fill="#2563EB"/>
    <text x="300" y="234" text-anchor="middle" class="count" font-size="16">2</text>
    <text x="328" y="234" class="phase" font-size="15">QUALIFY</text>

    <circle cx="528" cy="228" r="18" fill="#2563EB"/>
    <text x="528" y="234" text-anchor="middle" class="count" font-size="16">3</text>
    <text x="556" y="234" class="phase" font-size="15">ENRICH</text>

    <circle cx="756" cy="228" r="18" fill="#2563EB"/>
    <text x="756" y="234" text-anchor="middle" class="count" font-size="16">4</text>
    <text x="784" y="225" class="phase" font-size="13">SERP &amp;</text>
    <text x="784" y="243" class="phase" font-size="13">AUTHORITY</text>

    <circle cx="984" cy="228" r="18" fill="#2563EB"/>
    <text x="984" y="234" text-anchor="middle" class="count" font-size="16">5</text>
    <text x="1012" y="225" class="phase" font-size="13">DERIVED</text>
    <text x="1012" y="243" class="phase" font-size="13">SIGNALS</text>

    <circle cx="1212" cy="228" r="18" fill="#2563EB"/>
    <text x="1212" y="234" text-anchor="middle" class="count" font-size="16">6</text>
    <text x="1240" y="234" class="phase" font-size="14">CALCULATE</text>

    <circle cx="1440" cy="228" r="18" fill="#2563EB"/>
    <text x="1440" y="234" text-anchor="middle" class="count" font-size="16">7</text>
    <text x="1468" y="234" class="phase" font-size="14">VALIDATE</text>
  </g>

  <g>
    <rect x="62" y="280" width="160" height="74" rx="8" fill="#F7F9FC" stroke="#DCE3EC"/>
    <text x="78" y="309" class="body" font-size="15">Manual / CSV</text>
    <text x="78" y="333" class="muted" font-size="13">Keyword source</text>

    <rect x="62" y="370" width="160" height="96" rx="8" fill="#EEF5FF" stroke="#BFD4F8"/>
    <text x="78" y="399" class="body" font-size="15">GSC workbook</text>
    <text x="78" y="423" class="muted" font-size="13">Promote to keywords</text>
    <text x="78" y="444" class="muted" font-size="13">with provenance</text>

    <rect x="290" y="280" width="160" height="74" rx="8" fill="#F7F9FC" stroke="#DCE3EC"/>
    <text x="306" y="309" class="body" font-size="15">Detox</text>
    <text x="306" y="333" class="muted" font-size="13">Remove invalid input</text>

    <rect x="290" y="370" width="160" height="74" rx="8" fill="#F7F9FC" stroke="#DCE3EC"/>
    <text x="306" y="399" class="body" font-size="15">Categorisation</text>
    <text x="306" y="423" class="muted" font-size="13">Live + deferred tiers</text>

    <rect x="290" y="460" width="160" height="74" rx="8" fill="#F7F9FC" stroke="#DCE3EC"/>
    <text x="306" y="489" class="body" font-size="15">Brand detection</text>
    <text x="306" y="513" class="muted" font-size="13">Rules + AI fallback</text>

    <rect x="518" y="280" width="160" height="88" rx="8" fill="#F7F9FC" stroke="#DCE3EC"/>
    <text x="534" y="309" class="body" font-size="15">Keyword metrics</text>
    <text x="534" y="333" class="muted" font-size="13">Volume · difficulty</text>
    <text x="534" y="353" class="muted" font-size="13">history · intent</text>

    <rect x="518" y="384" width="160" height="74" rx="8" fill="#F7F9FC" stroke="#DCE3EC"/>
    <text x="534" y="413" class="body" font-size="15">Ranking URL</text>
    <text x="534" y="437" class="muted" font-size="13">Durable no-match state</text>

    <rect x="518" y="474" width="160" height="74" rx="8" fill="#F7F9FC" stroke="#DCE3EC"/>
    <text x="534" y="503" class="body" font-size="15">GSC intent</text>
    <text x="534" y="527" class="muted" font-size="13">Batched and resumable</text>

    <rect x="746" y="280" width="160" height="74" rx="8" fill="#F7F9FC" stroke="#DCE3EC"/>
    <text x="762" y="309" class="body" font-size="15">SERP collection</text>
    <text x="762" y="333" class="muted" font-size="13">Post · poll · reconcile</text>

    <rect x="746" y="370" width="160" height="74" rx="8" fill="#F7F9FC" stroke="#DCE3EC"/>
    <text x="762" y="399" class="body" font-size="15">Ahrefs authority</text>
    <text x="762" y="423" class="muted" font-size="13">URL + domain signals</text>

    <rect x="746" y="460" width="160" height="74" rx="8" fill="#F7F9FC" stroke="#DCE3EC"/>
    <text x="762" y="489" class="body" font-size="15">Backlinks</text>
    <text x="762" y="513" class="muted" font-size="13">Tracked provider work</text>

    <rect x="974" y="280" width="160" height="64" rx="8" fill="#F7F9FC" stroke="#DCE3EC"/>
    <text x="990" y="307" class="body" font-size="14">Site architecture</text>
    <text x="990" y="329" class="muted" font-size="12">Content fit</text>

    <rect x="974" y="358" width="160" height="64" rx="8" fill="#F7F9FC" stroke="#DCE3EC"/>
    <text x="990" y="385" class="body" font-size="14">Link power score</text>
    <text x="990" y="407" class="muted" font-size="12">No silent cap</text>

    <rect x="974" y="436" width="160" height="64" rx="8" fill="#F7F9FC" stroke="#DCE3EC"/>
    <text x="990" y="463" class="body" font-size="14">Demand signals</text>
    <text x="990" y="485" class="muted" font-size="12">Full reconciliation</text>

    <rect x="974" y="514" width="160" height="64" rx="8" fill="#F7F9FC" stroke="#DCE3EC"/>
    <text x="990" y="541" class="body" font-size="14">CTR curves</text>
    <text x="990" y="563" class="muted" font-size="12">Dependency-aware</text>

    <rect x="974" y="592" width="160" height="64" rx="8" fill="#F7F9FC" stroke="#DCE3EC"/>
    <text x="990" y="619" class="body" font-size="14">Clustering</text>
    <text x="990" y="641" class="muted" font-size="12">Set-based write-back</text>

    <rect x="1202" y="280" width="160" height="104" rx="8" fill="#EEF5FF" stroke="#BFD4F8"/>
    <text x="1218" y="311" class="body" font-size="16">HAR v2</text>
    <text x="1218" y="337" class="muted" font-size="13">Tracked model run</text>
    <text x="1218" y="359" class="muted" font-size="13">Versioned inputs</text>

    <line x1="1282" y1="395" x2="1282" y2="430" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1202" y="444" width="160" height="104" rx="8" fill="#EEF5FF" stroke="#BFD4F8"/>
    <text x="1218" y="475" class="body" font-size="16">Revenue v2</text>
    <text x="1218" y="501" class="muted" font-size="13">After HAR succeeds</text>
    <text x="1218" y="523" class="muted" font-size="13">Versioned outputs</text>

    <rect x="1430" y="280" width="188" height="104" rx="8" fill="#EEF8F0" stroke="#B7D9BF"/>
    <text x="1446" y="311" class="body" font-size="16">Calibration</text>
    <text x="1446" y="337" class="muted" font-size="13">Immutable snapshot</text>
    <text x="1446" y="359" class="muted" font-size="13">Approve or block</text>

    <line x1="1524" y1="395" x2="1524" y2="430" stroke="#15803D" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1430" y="444" width="188" height="104" rx="8" fill="#F1F8F3" stroke="#B7D9BF"/>
    <text x="1446" y="475" class="body" font-size="16">Promotion decision</text>
    <text x="1446" y="501" class="muted" font-size="13">Per-project gate</text>
    <text x="1446" y="523" class="muted" font-size="13">v1 remains available</text>
  </g>

  <g>
    <rect x="62" y="774" width="160" height="58" rx="8" fill="#F0F4FA"/>
    <text x="142" y="808" text-anchor="middle" class="badge" font-size="12">CLOUD RUN JOB</text>

    <rect x="290" y="774" width="160" height="58" rx="8" fill="#F0F4FA"/>
    <text x="370" y="797" text-anchor="middle" class="badge" font-size="11">CLOUD TASKS</text>
    <text x="370" y="815" text-anchor="middle" class="badge" font-size="11">+ WORKERS</text>

    <rect x="518" y="774" width="160" height="58" rx="8" fill="#F0F4FA"/>
    <text x="598" y="797" text-anchor="middle" class="badge" font-size="11">CLOUD TASKS</text>
    <text x="598" y="815" text-anchor="middle" class="badge" font-size="11">+ WORKERS</text>

    <rect x="746" y="774" width="160" height="58" rx="8" fill="#F0F4FA"/>
    <text x="826" y="797" text-anchor="middle" class="badge" font-size="11">PROVIDER</text>
    <text x="826" y="815" text-anchor="middle" class="badge" font-size="11">QUEUES</text>

    <rect x="974" y="774" width="160" height="58" rx="8" fill="#F0F4FA"/>
    <text x="1054" y="797" text-anchor="middle" class="badge" font-size="11">CLOUD RUN</text>
    <text x="1054" y="815" text-anchor="middle" class="badge" font-size="11">JOBS + TASKS</text>

    <rect x="1202" y="774" width="160" height="58" rx="8" fill="#F0F4FA"/>
    <text x="1282" y="808" text-anchor="middle" class="badge" font-size="12">CLOUD RUN JOBS</text>

    <rect x="1430" y="774" width="188" height="58" rx="8" fill="#F0F4FA"/>
    <text x="1524" y="808" text-anchor="middle" class="badge" font-size="12">CONTROLLED GATE</text>
  </g>

  <rect x="44" y="900" width="1592" height="92" rx="12" fill="#111318"/>
  <text x="72" y="938" class="count" font-size="16" letter-spacing="1.2">GOOGLE CLOUD WORKFLOWS OWNS THE SEQUENCE</text>
  <text x="72" y="968" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" font-weight="500" fill="#C8CFD9">
    Cloud SQL records run state and counts · Cloud Tasks controls retries and provider rate limits · the browser only starts and observes
  </text>
  <circle cx="1583" cy="946" r="18" fill="#2563EB"/>
  <path d="M1576 946l5 5 10-12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
